name: Deploy Workout Timer PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A new build id gives the service worker a new cache name, so installed
      # copies of the app see "A new version is available → Update".
      - name: Stamp build version
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" pwa/sw.js pwa/js/app.js
          rm -f pwa/README.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - id: deployment
        uses: actions/deploy-pages@v4
